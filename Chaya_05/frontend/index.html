<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go Live Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <section id="auth" class="auth">
    <div class="logo">💬</div>
    <h1>Go Live Chat</h1>
    <p>Real-time chat application</p>
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
    <input id="username" placeholder="Username" maxlength="24">
    <input id="password" type="password" placeholder="Password" maxlength="100">
    <button id="authButton" class="mainBtn">Login</button>
    <div id="authMessage"></div>
    <small>Runs directly with VS Code Live Server.</small>
  </section>

  <section id="app" class="app hidden">
    <aside>
      <div class="profile">
        <div class="avatar">●</div>
        <div><b>Go Live Chat</b><span id="me"></span></div>
        <button id="logout">↪</button>
      </div>
      <div class="newRoom">
        <input id="roomInput" placeholder="New room">
        <button id="createRoom">+</button>
      </div>
      <label>CHAT ROOMS</label>
      <div id="roomList"></div>
    </aside>

    <main>
      <header>
        <div>
          <h2 id="roomName">General</h2>
          <span id="status">● Connected</span>
        </div>
        <button id="notify">Enable notifications</button>
      </header>
      <div id="messages"></div>
      <form id="composer">
        <input id="message" autocomplete="off" placeholder="Message…  :smile: :heart:">
        <button>Send</button>
      </form>
    </main>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
